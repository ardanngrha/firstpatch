name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'

permissions:
  contents: read

concurrency:
  group: firstpatch-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refresh public sources and verify issues
        id: refresh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          USE_PUBLISHED_FALLBACK: 'true'
        run: npm run sync
      - name: Report refresh degradation
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::One or more sources failed. Check public data/status.json for retained snapshots and coverage.'
      - run: npm test
      - run: npm run build
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
